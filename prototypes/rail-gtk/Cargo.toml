[package]
name = "rail-gtk"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "ADR-0002 prototype: Bayleaf rails in GTK4 + gtk4-layer-shell"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
