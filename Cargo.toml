[workspace]
resolver = "3"
members = [
    "crates/bayleaf-comp",
    "crates/bayleaf-shell",
    "crates/bayleaf-osk",
    "crates/bayleaf-ipc",
]
exclude = ["prototypes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/MintCarasique/bayleaf"
authors = ["Bayleaf contributors"]

[workspace.dependencies]
bayleaf-ipc = { path = "crates/bayleaf-ipc" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
